<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>QuantBot AI量化机器人</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0f172a;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      .boot-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
      }
      .boot-fallback .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #334155;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .boot-fallback h1 { font-size: 24px; color: #f1f5f9; margin: 0; }
      .boot-fallback p { color: #94a3b8; font-size: 14px; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div class="spinner"></div>
        <h1>QuantBot AI量化机器人</h1>
        <p>正在启动...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
